<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Center — Campus Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(20, 184, 166, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --teal: #14b8a6;
      --teal-glow: rgba(20, 184, 166, 0.2);
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(20, 184, 166, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
    }

    header {
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 25, 0.8);
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #fff;
    }

    .brand img { height: 36px; width: auto; }
    .brand-title {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-badge {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    main {
      max-width: 1300px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      opacity: 0.5;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
      color: #fff;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      color: #fff;
    }

    .search-filter {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.875rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 2px var(--teal-glow);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-p-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-p-medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-p-low { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    .select-status {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.825rem;
      cursor: pointer;
    }

    .photo-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }

    .photo-thumb:hover { transform: scale(1.1); }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/dashboard" class="brand">
        <img src="/static/logo.png" alt="Logo" onerror="this.style.display='none'">
        <span class="brand-title">Campus Operations</span>
        <span class="admin-badge">Head Admin</span>
      </a>
            <div class="nav-actions">
        <button id="overdueBell" class="btn btn-secondary" onclick="toggleOverduePanel()" style="position:relative; display:none;">
          🔔 <span id="overdueCount" style="background:var(--red); color:white; border-radius:10px; padding:1px 6px; font-size:11px; margin-left:4px;">0</span>
        </button>
        <a href="/dashboard" class="btn btn-secondary">User View</a>
        <button onclick="logout()" class="btn btn-danger">Sign Out</button>
      </div>
    </header>

  <div id="overdueBanner" style="display:none; background:rgba(239,68,68,0.15); border-bottom:1px solid var(--red); color:var(--red); padding:10px 24px; text-align:center; font-weight:600;"></div>

  <main>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total System Issues</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Priority</div>
        <div class="stat-value" style="color: #fca5a5;" id="stat-high">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Action</div>
        <div class="stat-value" style="color: #fcd34d;" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Resolved Issues</div>
        <div class="stat-value" style="color: #6ee7b7;" id="stat-resolved">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Master Complaint Ledger</h2>
        <div class="search-filter">
          <input type="text" id="filter-search" class="input-field" placeholder="Search location or title..." oninput="filterTable()">
          <select id="filter-status" class="input-field" onchange="filterTable()">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Photo</th>
              <th>Title & Description</th>
              <th>Location</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Submitted By</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="complaints-tbody">
            <tr><td colspan="9" style="text-align:center; padding: 2rem; color: var(--text-muted);">Loading master records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="lightbox" class="modal" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Enlarged photo evidence">
  </div>

  <script>
    let allComplaints = [];
        async function loadOverdueComplaints() {
      try {
        const res = await fetch('/api/overdue-complaints');
        if (!res.ok) return;
        const data = await res.json();
        const bell = document.getElementById('overdueBell');
        const countSpan = document.getElementById('overdueCount');
        const banner = document.getElementById('overdueBanner');
        if (data.count > 0) {
          bell.style.display = 'inline-block';
          countSpan.textContent = data.count;
          banner.style.display = 'block';
          banner.textContent = `⚠ ${data.count} complaint(s) have been pending for over 6 days and need attention.`;
        } else {
          bell.style.display = 'none';
          banner.style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load overdue complaints:', err);
      }
    }
    function toggleOverduePanel() {
      const banner = document.getElementById('overdueBanner');
      banner.style.display = banner.style.display === 'none' ? 'block' : 'none';
    }

    async function loadAdminData() {
      try {
        const res = await fetch('/api/complaints');
        if (res.status === 401 || res.status === 403) {
          alert("Admin access denied. Please login as Head Admin.");
          window.location.href = '/login?next=/admin';
          return;
        }
        allComplaints = await res.json();
        updateStats();
        renderTable(allComplaints);
      } catch (err) {
        console.error("Failed to load admin data:", err);
      }
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = allComplaints.length;
      document.getElementById('stat-high').innerText = allComplaints.filter(c => c.priority === 'High').length;
      document.getElementById('stat-pending').innerText = allComplaints.filter(c => c.status === 'Pending').length;
      document.getElementById('stat-resolved').innerText = allComplaints.filter(c => c.status === 'Resolved').length;
    }

    function renderTable(data) {
      const tbody = document.getElementById('complaints-tbody');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color: var(--text-muted);">No complaints found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(c => `
        <tr>
          <td><code style="font-family:'IBM Plex Mono'; color:var(--teal);">#${c.id}</code></td>
          <td>
            ${c.photo_url 
              ? `<img src="${c.photo_url}" class="photo-thumb" onclick="openLightbox('${c.photo_url}')" alt="Evidence">` 
              : `<span style="color:var(--text-muted); font-size:0.8rem;">No photo</span>`}
          </td>
          <td>
            <strong style="color:#fff;">${escapeHtml(c.title)}</strong>
            <div style="color:var(--text-muted); font-size:0.825rem; max-width: 280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.description || 'No description')}</div>
          </td>
          <td>${escapeHtml(c.location)}</td>
          <td><span class="badge badge-p-${(c.priority||'medium').toLowerCase()}">${c.priority}</span></td>
          <td>
            <select class="select-status" onchange="updateStatus(${c.id}, this.value)">
              <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Resolved" ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </td>
          <td>${escapeHtml(c.owner_username || 'System/Pre-migrated')}</td>
          <td style="font-size:0.8rem; color:var(--text-muted);">${c.created_at ? new Date(c.created_at).toLocaleString() : '-'}</td>
          <td>
            <button class="btn btn-danger" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="deleteComplaint(${c.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('filter-search').value.toLowerCase();
      const status = document.getElementById('filter-status').value;
      const filtered = allComplaints.filter(c => {
        const matchesQ = c.title.toLowerCase().includes(q) || c.location.toLowerCase().includes(q);
        const matchesStatus = !status || c.status === status;
        return matchesQ && matchesStatus;
      });
      renderTable(filtered);
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/complaints/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          loadAdminData();
        } else {
          alert("Failed to update status");
        }
      } catch (err) {
        console.error("Status update error:", err);
      }
    }

    async function deleteComplaint(id) {
      if (!confirm(`Are you sure you want to delete complaint #${id}?`)) return;
      try {
        const res = await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadAdminData();
        } else {
          alert("Failed to delete complaint");
        }
      } catch (err) {
        console.error("Delete error:", err);
      }
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').style.display = 'flex';
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    loadAdminData();
    loadOverdueComplaints();
  </script>
</body>
</html>
